<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" role="img" aria-labelledby="title desc">
  <title id="title">Miền nghiệm x cộng 2y nhỏ hơn hoặc bằng 4</title>
  <desc id="desc">Đường biên qua 4 phẩy 0 và 0 phẩy 2, miền chứa gốc tọa độ được tô xanh.</desc>
  <rect width="520" height="320" fill="#fff"/>
  <polygon points="60,260 60,150 440,260" fill="#dcfce7"/>
  <g stroke="#94a3b8" stroke-width="2"><path d="M40 260H480"/><path d="M60 290V30"/></g>
  <path d="M60 150L440 260" stroke="#059669" stroke-width="4"/>
  <g fill="#0f172a" font-family="Arial" font-size="17"><text x="466" y="282">x</text><text x="40" y="45">y</text><text x="447" y="282">4</text><text x="38" y="155">2</text><text x="70" y="282">O</text><text x="280" y="140">x + 2y = 4</text></g>
</svg>
