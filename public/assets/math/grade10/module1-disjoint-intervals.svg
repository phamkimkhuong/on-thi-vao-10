<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Hai khoảng không giao nhau trên trục số</title>
  <desc id="desc">Sơ đồ minh họa hai trường hợp khoảng A nằm hoàn toàn bên trái hoặc hoàn toàn bên phải khoảng B từ âm một đến năm.</desc>
  <rect width="760" height="360" rx="24" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">Điều kiện A ∩ B = ∅</text>
  <g font-family="Arial,sans-serif" font-size="16" fill="#334155">
    <text x="52" y="91" font-weight="700">Trường hợp 1: A nằm bên trái B</text>
    <line x1="70" y1="137" x2="690" y2="137" stroke="#64748b" stroke-width="3"/>
    <path d="M690 137l-12-7v14z" fill="#64748b"/>
    <line x1="270" y1="121" x2="270" y2="153" stroke="#0f172a" stroke-width="2"/>
    <line x1="480" y1="121" x2="480" y2="153" stroke="#0f172a" stroke-width="2"/>
    <line x1="160" y1="115" x2="250" y2="115" stroke="#f97316" stroke-width="12" stroke-linecap="round"/>
    <circle cx="250" cy="115" r="8" fill="#fff" stroke="#f97316" stroke-width="4"/>
    <line x1="270" y1="159" x2="480" y2="159" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
    <text x="205" y="105" text-anchor="middle" fill="#c2410c">A</text>
    <text x="375" y="190" text-anchor="middle" fill="#1d4ed8">B = [−1; 5]</text>
    <text x="270" y="181" text-anchor="middle">−1</text>
    <text x="480" y="181" text-anchor="middle">5</text>
    <text x="52" y="236" font-weight="700">Trường hợp 2: A nằm bên phải B</text>
    <line x1="70" y1="282" x2="690" y2="282" stroke="#64748b" stroke-width="3"/>
    <path d="M690 282l-12-7v14z" fill="#64748b"/>
    <line x1="270" y1="266" x2="270" y2="298" stroke="#0f172a" stroke-width="2"/>
    <line x1="480" y1="266" x2="480" y2="298" stroke="#0f172a" stroke-width="2"/>
    <line x1="270" y1="304" x2="480" y2="304" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
    <circle cx="500" cy="260" r="8" fill="#fff" stroke="#f97316" stroke-width="4"/>
    <line x1="500" y1="260" x2="620" y2="260" stroke="#f97316" stroke-width="12" stroke-linecap="round"/>
    <text x="560" y="248" text-anchor="middle" fill="#c2410c">A</text>
    <text x="375" y="338" text-anchor="middle" fill="#1d4ed8">B = [−1; 5]</text>
    <text x="270" y="326" text-anchor="middle">−1</text>
    <text x="480" y="326" text-anchor="middle">5</text>
  </g>
</svg>
