<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc">
  <title id="title">Sắp xếp nam nữ xen kẽ</title>
  <desc id="desc">Bảy vị trí thẳng hàng theo mẫu nam, nữ, nam, nữ, nam, nữ, nam.</desc>
  <rect width="760" height="340" rx="24" fill="#f8fafc"/>
  <text x="380" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">Mẫu vị trí bắt buộc khi có 4 nam và 3 nữ</text>
  <g font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    <g fill="#dbeafe" stroke="#2563eb" stroke-width="3">
      <circle cx="95" cy="145" r="42"/><circle cx="285" cy="145" r="42"/><circle cx="475" cy="145" r="42"/><circle cx="665" cy="145" r="42"/>
    </g>
    <g fill="#fae8ff" stroke="#c026d3" stroke-width="3">
      <circle cx="190" cy="145" r="42"/><circle cx="380" cy="145" r="42"/><circle cx="570" cy="145" r="42"/>
    </g>
    <g fill="#1e3a8a"><text x="95" y="152">Nam</text><text x="285" y="152">Nam</text><text x="475" y="152">Nam</text><text x="665" y="152">Nam</text></g>
    <g fill="#86198f"><text x="190" y="152">Nữ</text><text x="380" y="152">Nữ</text><text x="570" y="152">Nữ</text></g>
    <path d="M95 218H665" stroke="#64748b" stroke-width="3"/>
    <g fill="#334155"><text x="95" y="250">1</text><text x="190" y="250">2</text><text x="285" y="250">3</text><text x="380" y="250">4</text><text x="475" y="250">5</text><text x="570" y="250">6</text><text x="665" y="250">7</text></g>
    <text x="380" y="305" fill="#0f172a">Số cách: 4! × 3!</text>
  </g>
</svg>
