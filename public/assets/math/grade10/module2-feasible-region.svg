<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">Miền nghiệm của hệ bất phương trình</title>
  <desc id="desc">Miền tứ giác OABC trong góc phần tư thứ nhất với các đỉnh O không không, A ba không, B hai hai và C không bốn.</desc>
  <rect width="760" height="440" rx="24" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">Miền nghiệm trong mặt phẳng Oxy</text>
  <g transform="translate(95 382)" font-family="Arial,sans-serif">
    <g stroke="#cbd5e1" stroke-width="1">
      <path d="M0-60H560M0-120H560M0-180H560M0-240H560M0-300H560"/>
      <path d="M70 0V-330M140 0V-330M210 0V-330M280 0V-330M350 0V-330M420 0V-330M490 0V-330"/>
    </g>
    <path d="M0 0H585M0 0V-345" stroke="#334155" stroke-width="3"/>
    <path d="M585 0l-13-7v14zM0-345l-7 13h14z" fill="#334155"/>
    <path d="M0 0L210 0L140-120L0-240Z" fill="#38bdf8" fill-opacity=".35" stroke="#0284c7" stroke-width="4"/>
    <path d="M0-240L280 0" stroke="#f97316" stroke-width="3" stroke-dasharray="9 7"/>
    <path d="M0-360L210 0" stroke="#8b5cf6" stroke-width="3" stroke-dasharray="9 7"/>
    <g fill="#0f172a" font-size="16" font-weight="700">
      <circle cx="0" cy="0" r="6"/><text x="-30" y="22">O(0;0)</text>
      <circle cx="210" cy="0" r="6"/><text x="194" y="26">A(3;0)</text>
      <circle cx="140" cy="-120" r="6"/><text x="152" y="-126">B(2;2)</text>
      <circle cx="0" cy="-240" r="6"/><text x="12" y="-248">C(0;4)</text>
      <text x="590" y="20">x</text><text x="-24" y="-350">y</text>
    </g>
    <text x="315" y="-54" fill="#c2410c" font-size="15">x + y = 4</text>
    <text x="245" y="-260" fill="#6d28d9" font-size="15">2x + y = 6</text>
  </g>
</svg>
