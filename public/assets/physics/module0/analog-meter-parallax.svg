<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Sơ đồ đọc đồng hồ kim bị thị sai</title>
  <desc id="desc">Kim đồng hồ nằm phía trên thang chia có dải gương. Mắt quan sát lệch sang bên nên đường nhìn xiên, kim và ảnh của kim trong gương không trùng nhau.</desc>
