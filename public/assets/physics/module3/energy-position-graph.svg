<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Đồ thị động năng và thế năng theo vị trí</title>
  <desc id="desc">Cơ năng không đổi 100 jun. Tại vị trí B, thế năng là 75 jun nên động năng là 25 jun.</desc>
  <rect width="720" height="420" fill="#f8fafc"/>
  <path d="M90 340 H660 M90 340 V50" fill="none" stroke="#334155" stroke-width="4"/>
  <path d="M90 80 H630" stroke="#0f766e" stroke-width="6"/>
  <path d="M90 300 L630 105" stroke="#4f46e5" stroke-width="6"/>
  <path d="M90 120 L630 315" stroke="#f59e0b" stroke-width="6"/>
  <path d="M450 340 V145" stroke="#64748b" stroke-width="3" stroke-dasharray="8 7"/>
  <g font-family="Arial, sans-serif" font-size="20" fill="#1e293b">
    <text x="18" y="58">W (J)</text><text x="625" y="375">Vị trí</text><text x="55" y="87">100</text>
    <text x="455" y="365">B</text><text x="500" y="69" fill="#0f766e">Cơ năng</text>
    <text x="500" y="145" fill="#3730a3">Thế năng</text><text x="500" y="290" fill="#92400e">Động năng</text>
    <text x="410" y="145">75</text><text x="410" y="285">25</text>
  </g>
</svg>
