<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Đồ thị hai lực theo quãng đường</title>
  <desc id="desc">Từ 0 đến 4 mét, lực kéo cùng chiều có giá trị dương 8 niutơn và lực cản có giá trị âm 3 niutơn.</desc>
  <rect width="720" height="420" fill="#f8fafc"/>
  <path d="M90 300 H665 M90 360 V45" fill="none" stroke="#334155" stroke-width="4"/>
  <path d="M90 105 H610" stroke="#4f46e5" stroke-width="7"/>
  <path d="M90 300 H610" stroke="#dc2626" stroke-width="7"/>
  <path d="M610 105 V300" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 7"/>
  <g font-family="Arial, sans-serif" font-size="21" fill="#1e293b">
    <text x="625" y="340">s (m)</text><text x="25" y="55">F (N)</text>
    <text x="58" y="112">8</text><text x="50" y="308">−3</text><text x="600" y="330">4</text>
    <text x="485" y="92" fill="#3730a3">Lực kéo</text><text x="470" y="288" fill="#991b1b">Lực cản</text>
  </g>
</svg>
