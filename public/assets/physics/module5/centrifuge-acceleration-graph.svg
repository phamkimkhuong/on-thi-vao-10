<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Đồ thị gia tốc hướng tâm theo bình phương tốc độ góc</title>
  <desc id="desc">Đường thẳng đi qua gốc tọa độ và các điểm có hoành độ omega bình phương 16, 36, 64, 100; tung độ gia tốc lần lượt 4, 9, 16, 25 mét trên giây bình phương.</desc>
  <rect width="720" height="420" fill="#fff"/>
  <g stroke="#d7deea" stroke-width="1">
    <path d="M90 330H660M90 270H660M90 210H660M90 150H660M90 90H660"/>
    <path d="M204 50V330M318 50V330M432 50V330M546 50V330M660 50V330"/>
  </g>
  <g stroke="#26364d" stroke-width="2" fill="none"><path d="M90 45V330H675"/><path d="M84 55l6-10 6 10M665 324l10 6-10 6"/></g>
  <path d="M90 330L660 30" stroke="#6556e8" stroke-width="4" fill="none"/>
  <g fill="#6556e8"><circle cx="181.2" cy="282" r="6"/><circle cx="295.2" cy="222" r="6"/><circle cx="454.8" cy="138" r="6"/><circle cx="660" cy="30" r="6"/></g>
  <g font-family="Arial, sans-serif" font-size="17" fill="#26364d">
    <text x="610" y="375">ω² (s⁻²)</text><text x="24" y="48">aₕₜ (m/s²)</text>
    <text x="171" y="355">16</text><text x="285" y="355">36</text><text x="444" y="355">64</text><text x="646" y="355">100</text>
    <text x="65" y="287">4</text><text x="65" y="227">9</text><text x="57" y="143">16</text><text x="57" y="35">25</text>
    <text x="350" y="82" fill="#6556e8">aₕₜ = 0,25ω²</text>
  </g>
</svg>
