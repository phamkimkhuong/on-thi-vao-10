<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Đồ thị vận tốc thời gian của chuyển động biến đổi đều</title>
  <desc id="desc">Đường thẳng tăng từ vận tốc 2 mét trên giây tại thời điểm 0 giây đến vận tốc 10 mét trên giây tại thời điểm 4 giây.</desc>
  <rect width="720" height="420" fill="#fff"/>
  <g stroke="#d7deea" stroke-width="1"><path d="M90 330H660M90 270H660M90 210H660M90 150H660M90 90H660"/><path d="M232.5 50V330M375 50V330M517.5 50V330M660 50V330"/></g>
  <g stroke="#26364d" stroke-width="2" fill="none"><path d="M90 45V330H675"/><path d="M84 55l6-10 6 10M665 324l10 6-10 6"/></g>
  <path d="M90 282L660 90" stroke="#6556e8" stroke-width="4" fill="none"/>
  <g fill="#6556e8"><circle cx="90" cy="282" r="6"/><circle cx="660" cy="90" r="6"/></g>
  <g font-family="Arial, sans-serif" font-size="18" fill="#26364d"><text x="625" y="380">t (s)</text><text x="28" y="48">v (m/s)</text><text x="648" y="355">4</text><text x="65" y="287">2</text><text x="57" y="95">10</text><text x="330" y="145" fill="#6556e8">v = 2 + 2t</text></g>
</svg>
