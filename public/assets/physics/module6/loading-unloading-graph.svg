<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Đồ thị tăng tải và dỡ tải có biến dạng dư</title>
  <desc id="desc">Đường tăng tải đi từ gốc đến lực 10 niutơn và độ dãn 5 xentimét. Đường dỡ tải trở về lực bằng không tại độ dãn 1 xentimét, cho thấy lò xo không hồi phục hoàn toàn.</desc>
