  <g stroke="#26364d" stroke-width="2" fill="none"><path d="M90 45V330H675"/><path d="M84 55l6-10 6 10M665 324l10 6-10 6"/></g>
  <path d="M90 330L660 90" stroke="#6556e8" stroke-width="4" fill="none"/><path d="M660 90L204 330" stroke="#e5484d" stroke-width="4" fill="none"/>
