<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Đồ thị tốc độ phản ứng thuận và nghịch theo thời gian</title>
  <desc id="desc">Tốc độ thuận giảm từ giá trị cao, tốc độ nghịch tăng từ gần không; hai tốc độ bằng nhau từ thời điểm 25 giây và giữ bằng nhau sau đó.</desc>
  <rect width="720" height="420" fill="#fff"/>
  <g stroke="#d7deea" stroke-width="1">
    <path d="M90 80H660M90 140H660M90 200H660M90 260H660M90 320H660"/>
    <path d="M190 50V340M290 50V340M390 50V340M490 50V340M590 50V340"/>
  </g>
  <path d="M90 50V340H670" fill="none" stroke="#334155" stroke-width="2"/>
  <g fill="#334155" font-family="Arial, sans-serif" font-size="16">
    <text x="28" y="58">v</text><text x="635" y="375">t (s)</text>
    <text x="72" y="325">0</text><text x="180" y="365">10</text><text x="280" y="365">20</text>
    <text x="380" y="365">30</text><text x="480" y="365">40</text><text x="580" y="365">50</text>
  </g>
  <path d="M90 75C175 110 235 155 290 195S350 220 340 220H640" fill="none" stroke="#dc2626" stroke-width="5"/>
  <path d="M90 320C175 295 235 255 290 230S320 220 340 220H640" fill="none" stroke="#16a34a" stroke-width="5"/>
  <path d="M340 50V340" stroke="#64748b" stroke-width="2" stroke-dasharray="8 7"/>
  <g font-family="Arial, sans-serif" font-size="18" font-weight="700">
    <text x="520" y="202" fill="#dc2626">v thuận</text><text x="520" y="245" fill="#16a34a">v nghịch</text>
    <text x="350" y="75" fill="#475569">25 s</text>
  </g>
</svg>
