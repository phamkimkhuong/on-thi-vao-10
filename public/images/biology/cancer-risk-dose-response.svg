<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Mức hút thuốc và nguy cơ tương đối</title>
  <desc id="desc">Nguy cơ tương đối tăng từ một lên bảy khi số điếu thuốc mỗi ngày tăng từ không lên hai mươi lăm.</desc>
  <rect width="720" height="420" rx="28" fill="#f8fafc"/>
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="90" y1="340" x2="660" y2="340"/><line x1="90" y1="295" x2="660" y2="295"/>
    <line x1="90" y1="250" x2="660" y2="250"/><line x1="90" y1="205" x2="660" y2="205"/>
    <line x1="90" y1="160" x2="660" y2="160"/><line x1="90" y1="115" x2="660" y2="115"/>
    <line x1="90" y1="70" x2="660" y2="70"/>
  </g>
  <g stroke="#334155" stroke-width="3"><line x1="90" y1="50" x2="90" y2="340"/><line x1="90" y1="340" x2="670" y2="340"/></g>
  <polyline points="110,305 240,270 430,190 620,70" fill="none" stroke="#dc2626" stroke-width="6" stroke-linejoin="round"/>
  <g fill="#dc2626" stroke="#fff" stroke-width="3"><circle cx="110" cy="305" r="9"/><circle cx="240" cy="270" r="9"/><circle cx="430" cy="190" r="9"/><circle cx="620" cy="70" r="9"/></g>
  <g font-family="Arial, sans-serif" font-size="18" fill="#334155">
    <text x="102" y="370">0</text><text x="234" y="370">5</text><text x="420" y="370">15</text><text x="610" y="370">25</text>
    <text x="58" y="312">1</text><text x="58" y="272">2</text><text x="58" y="197">4</text><text x="58" y="77">7</text>
    <text x="280" y="405">Số điếu thuốc/ngày</text>
    <text transform="translate(22 270) rotate(-90)">Nguy cơ tương đối</text>
  </g>
</svg>
