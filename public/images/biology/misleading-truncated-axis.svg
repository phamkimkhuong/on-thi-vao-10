<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Ảnh hưởng của việc cắt trục tung đến cảm nhận chênh lệch</title>
  <desc id="desc">Biểu đồ A dùng trục từ 0 đến 100 và biểu đồ B dùng trục từ 95 đến 100. Cả hai đều thể hiện cùng hai giá trị 98 và 96 phần trăm nhưng biểu đồ B làm chênh lệch trông lớn hơn.</desc>
  <rect width="760" height="430" rx="24" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Cùng dữ liệu, khác điểm bắt đầu trục</text>
  <g font-family="Arial, sans-serif">
    <text x="205" y="70" text-anchor="middle" font-size="18" font-weight="700" fill="#1e40af">A. Trục 0–100%</text>
    <line x1="70" y1="340" x2="340" y2="340" stroke="#334155" stroke-width="3"/><line x1="70" y1="340" x2="70" y2="90" stroke="#334155" stroke-width="3"/>
    <g stroke="#e2e8f0"><line x1="70" y1="215" x2="340" y2="215"/><line x1="70" y1="90" x2="340" y2="90"/></g>
    <g font-size="13" fill="#475569"><text x="58" y="345" text-anchor="end">0</text><text x="58" y="220" text-anchor="end">50</text><text x="58" y="95" text-anchor="end">100</text></g>
    <rect x="115" y="95" width="70" height="245" fill="#60a5fa"/><rect x="225" y="100" width="70" height="240" fill="#fb7185"/>
    <text x="150" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#1e40af">98%</text><text x="260" y="91" text-anchor="middle" font-size="16" font-weight="700" fill="#9f1239">96%</text>
    <text x="150" y="365" text-anchor="middle" font-size="14">Nhóm X</text><text x="260" y="365" text-anchor="middle" font-size="14">Nhóm Y</text>
    <text x="555" y="70" text-anchor="middle" font-size="18" font-weight="700" fill="#9f1239">B. Trục 95–100%</text>
    <line x1="420" y1="340" x2="690" y2="340" stroke="#334155" stroke-width="3"/><line x1="420" y1="340" x2="420" y2="90" stroke="#334155" stroke-width="3"/>
    <g stroke="#e2e8f0"><line x1="420" y1="240" x2="690" y2="240"/><line x1="420" y1="140" x2="690" y2="140"/><line x1="420" y1="90" x2="690" y2="90"/></g>
    <g font-size="13" fill="#475569"><text x="408" y="345" text-anchor="end">95</text><text x="408" y="245" text-anchor="end">97</text><text x="408" y="145" text-anchor="end">99</text><text x="408" y="95" text-anchor="end">100</text></g>
    <rect x="465" y="190" width="70" height="150" fill="#60a5fa"/><rect x="575" y="290" width="70" height="50" fill="#fb7185"/>
    <text x="500" y="180" text-anchor="middle" font-size="16" font-weight="700" fill="#1e40af">98%</text><text x="610" y="280" text-anchor="middle" font-size="16" font-weight="700" fill="#9f1239">96%</text>
    <text x="500" y="365" text-anchor="middle" font-size="14">Nhóm X</text><text x="610" y="365" text-anchor="middle" font-size="14">Nhóm Y</text>
  </g>
  <rect x="165" y="390" width="430" height="27" rx="13" fill="#fff7ed" stroke="#fb923c"/><text x="380" y="409" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412">Chênh lệch thật ở cả hai biểu đồ: 2 điểm phần trăm</text>
</svg>
