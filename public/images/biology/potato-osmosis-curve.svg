<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Đổi khối lượng khoai theo nồng độ sucrose</title>
  <desc id="desc">Đường xu hướng giảm từ dương sang âm và cắt mức không phần trăm gần nồng độ 0,32 mol trên lít.</desc>
  <rect width="760" height="420" rx="18" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033">Thẩm thấu ở mô khoai</text>
  <g stroke="#d9e2ec" stroke-width="1"><line x1="95" y1="90" x2="700" y2="90"/><line x1="95" y1="150" x2="700" y2="150"/><line x1="95" y1="210" x2="700" y2="210"/><line x1="95" y1="270" x2="700" y2="270"/><line x1="95" y1="330" x2="700" y2="330"/></g>
  <g stroke="#475569" stroke-width="2"><line x1="95" y1="70" x2="95" y2="330"/><line x1="95" y1="210" x2="700" y2="210" stroke-dasharray="7 5"/></g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#475569">
    <text x="80" y="95" text-anchor="end">+10</text><text x="80" y="155" text-anchor="end">+5</text><text x="80" y="215" text-anchor="end">0</text><text x="80" y="275" text-anchor="end">−5</text><text x="80" y="335" text-anchor="end">−10</text>
    <text x="160" y="352" text-anchor="middle">0,10</text><text x="285" y="352" text-anchor="middle">0,20</text><text x="410" y="352" text-anchor="middle">0,30</text><text x="535" y="352" text-anchor="middle">0,40</text><text x="660" y="352" text-anchor="middle">0,50</text>
    <text x="390" y="388" text-anchor="middle" font-size="15">Nồng độ sucrose (mol/L)</text><text transform="translate(24 210) rotate(-90)" text-anchor="middle" font-size="15">Đổi khối lượng (%)</text>
  </g>
  <polyline points="160,114 285,162 410,198 535,246 660,294" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#7c3aed" stroke="#4c1d95" stroke-width="2"><circle cx="160" cy="114" r="7"/><circle cx="285" cy="162" r="7"/><circle cx="410" cy="198" r="7"/><circle cx="535" cy="246" r="7"/><circle cx="660" cy="294" r="7"/></g>
  <line x1="435" y1="210" x2="435" y2="330" stroke="#059669" stroke-width="3" stroke-dasharray="6 5"/><text x="445" y="235" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#047857">≈ 0,32 M</text>
</svg>
