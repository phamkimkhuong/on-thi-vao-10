<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Các bước thực bào và điểm thuốc X ức chế actin</title>
  <desc id="desc">Vi khuẩn bám vào thụ thể, actin giúp tạo chân giả bao quanh, túi thực bào khép kín rồi hòa lysosome. Thuốc X chặn giữa bước bám và tạo chân giả.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <rect width="760" height="420" rx="24" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Thực bào phụ thuộc tái tổ chức actin</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(35 92)"><circle cx="72" cy="118" r="68" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="72" cy="25" r="20" fill="#f97316"/><g fill="#9a3412"><circle cx="60" cy="17" r="3"/><circle cx="80" cy="16" r="3"/><circle cx="75" cy="33" r="3"/></g><path d="M58 55q14-23 28 0" fill="none" stroke="#7c3aed" stroke-width="5"/><text x="72" y="214" font-size="16" font-weight="700" fill="#1e3a8a">1. Bám thụ thể</text></g>
    <g transform="translate(220 92)"><path d="M20 150C15 75 45 45 78 83C110 42 146 77 136 150C110 180 48 180 20 150z" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><circle cx="78" cy="67" r="20" fill="#f97316"/><path d="M38 105C48 76 58 64 67 56M118 105C106 76 98 64 88 56" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/><text x="78" y="214" font-size="16" font-weight="700" fill="#166534">2. Tạo chân giả</text><text x="78" y="237" font-size="13" fill="#166534">(actin)</text></g>
    <g transform="translate(405 92)"><circle cx="72" cy="118" r="68" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><circle cx="72" cy="118" r="36" fill="#fff" stroke="#7c3aed" stroke-width="3"/><circle cx="72" cy="118" r="19" fill="#f97316"/><text x="72" y="214" font-size="16" font-weight="700" fill="#5b21b6">3. Túi thực bào</text></g>
    <g transform="translate(590 92)"><circle cx="72" cy="118" r="68" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><circle cx="53" cy="110" r="30" fill="#fff" stroke="#7c3aed" stroke-width="3"/><circle cx="88" cy="125" r="30" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><path d="M58 112l12 8m-8-18l15 4m-3 18l12 7" stroke="#dc2626" stroke-width="3"/><text x="72" y="214" font-size="16" font-weight="700" fill="#991b1b">4. Hòa lysosome</text></g>
  </g>
  <line x1="150" y1="210" x2="210" y2="210" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/><line x1="335" y1="210" x2="395" y2="210" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/><line x1="520" y1="210" x2="580" y2="210" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M186 115v108" stroke="#dc2626" stroke-width="7"/><path d="M166 134l40 40M206 134l-40 40" stroke="#dc2626" stroke-width="7" stroke-linecap="round"/>
  <rect x="120" y="325" width="132" height="48" rx="14" fill="#fee2e2" stroke="#dc2626"/><text x="186" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#991b1b">Thuốc X</text><text x="186" y="364" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#991b1b">ức chế actin</text>
  <text x="460" y="361" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">Thụ thể vẫn nhận diện được vi khuẩn</text>
</svg>
