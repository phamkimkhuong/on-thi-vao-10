<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Tính chất ligand và vị trí thụ thể</title>
  <desc id="desc">Ligand L phân cực không xuyên màng và gắn thụ thể Rm trên màng. Ligand S tan trong lipid xuyên màng rồi gắn thụ thể Ri trong tế bào.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <rect width="760" height="420" rx="24" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Hai cách tế bào tiếp nhận tín hiệu</text>
  <line x1="45" y1="170" x2="715" y2="170" stroke="#f59e0b" stroke-width="12"/><line x1="45" y1="190" x2="715" y2="190" stroke="#f59e0b" stroke-width="12"/>
  <g font-family="Arial, sans-serif"><text x="52" y="145" font-size="14" fill="#64748b">Ngoài tế bào</text><text x="52" y="222" font-size="14" fill="#64748b">Trong tế bào</text></g>
  <g transform="translate(90 68)"><circle cx="50" cy="38" r="30" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="50" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1e40af">L</text><text x="50" y="83" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1e40af">Phân cực</text></g>
  <line x1="140" y1="135" x2="210" y2="158" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M205 130q25 40 0 100M250 130q-25 40 0 100" fill="#c4b5fd" stroke="#7c3aed" stroke-width="4"/>
  <text x="227" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#5b21b6">Rm</text><text x="227" y="281" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5b21b6">Thụ thể màng</text>
  <path d="M270 226c35 18 52 38 65 67" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow)"/>
  <circle cx="355" cy="315" r="34" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="355" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#5b21b6">Tín hiệu</text>
  <g transform="translate(460 68)"><circle cx="50" cy="38" r="30" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="50" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#166534">S</text><text x="50" y="83" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#166534">Tan lipid</text></g>
  <path d="M510 135v120" fill="none" stroke="#16a34a" stroke-width="4" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <path d="M540 285q28-32 56 0q-28 32-56 0" fill="#bbf7d0" stroke="#16a34a" stroke-width="3"/><text x="568" y="331" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#166534">Ri</text><text x="568" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#166534">Thụ thể nội bào</text>
  <line x1="600" y1="285" x2="650" y2="285" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><circle cx="684" cy="285" r="30" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="684" y="291" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#991b1b">Nhân</text>
  <text x="380" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#475569">Vị trí thụ thể phải phù hợp khả năng ligand tiếp cận</text>
</svg>
