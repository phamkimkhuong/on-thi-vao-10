<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Tải lượng virus và tổn thương mô theo thời gian</title>
  <desc id="desc">Đường xanh của tải lượng virus đạt đỉnh khoảng ngày 5 rồi giảm. Đường đỏ của tổn thương mô đạt đỉnh muộn hơn khoảng ngày 7.</desc>
  <rect width="760" height="420" rx="18" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033">Diễn biến sau nhiễm virus</text>
  <g stroke="#d9e2ec" stroke-width="1">
    <line x1="90" y1="90" x2="700" y2="90"/><line x1="90" y1="150" x2="700" y2="150"/><line x1="90" y1="210" x2="700" y2="210"/><line x1="90" y1="270" x2="700" y2="270"/><line x1="90" y1="330" x2="700" y2="330"/>
  </g>
  <g stroke="#475569" stroke-width="2"><line x1="90" y1="70" x2="90" y2="330"/><line x1="90" y1="330" x2="700" y2="330"/></g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#475569">
    <text x="76" y="335" text-anchor="end">0</text><text x="76" y="275" text-anchor="end">25</text><text x="76" y="215" text-anchor="end">50</text><text x="76" y="155" text-anchor="end">75</text><text x="76" y="95" text-anchor="end">100</text>
    <text x="90" y="354" text-anchor="middle">1</text><text x="165" y="354" text-anchor="middle">2</text><text x="240" y="354" text-anchor="middle">3</text><text x="315" y="354" text-anchor="middle">4</text><text x="390" y="354" text-anchor="middle">5</text><text x="465" y="354" text-anchor="middle">6</text><text x="540" y="354" text-anchor="middle">7</text><text x="615" y="354" text-anchor="middle">8</text><text x="690" y="354" text-anchor="middle">9</text>
    <text x="395" y="388" text-anchor="middle" font-size="15">Ngày sau nhiễm</text>
    <text transform="translate(24 210) rotate(-90)" text-anchor="middle" font-size="15">Mức tương đối</text>
  </g>
  <polyline points="90,310 165,280 240,220 315,135 390,88 465,150 540,220 615,275 690,305" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="90,320 165,310 240,285 315,245 390,195 465,130 540,92 615,120 690,180" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Arial, sans-serif" font-size="14" font-weight="700">
    <line x1="470" y1="55" x2="505" y2="55" stroke="#2563eb" stroke-width="5"/><text x="515" y="60" fill="#1e3a8a">Tải lượng virus</text>
    <line x1="470" y1="78" x2="505" y2="78" stroke="#dc2626" stroke-width="5"/><text x="515" y="83" fill="#7f1d1d">Tổn thương mô</text>
  </g>
</svg>
