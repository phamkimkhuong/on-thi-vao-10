<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Gradient sodium và hấp thu glucose</title>
  <desc id="desc">Khi gradient sodium tương đối giảm từ 100 xuống 20 phần trăm, tốc độ hấp thu glucose giảm từ khoảng 95 xuống 18 đơn vị.</desc>
  <rect width="760" height="420" rx="18" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033">Động lực của đồng vận chuyển Na+/glucose</text>
  <g stroke="#d9e2ec" stroke-width="1"><line x1="95" y1="90" x2="700" y2="90"/><line x1="95" y1="150" x2="700" y2="150"/><line x1="95" y1="210" x2="700" y2="210"/><line x1="95" y1="270" x2="700" y2="270"/><line x1="95" y1="330" x2="700" y2="330"/></g>
  <g stroke="#475569" stroke-width="2"><line x1="95" y1="70" x2="95" y2="330"/><line x1="95" y1="330" x2="700" y2="330"/></g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#475569"><text x="80" y="335" text-anchor="end">0</text><text x="80" y="275" text-anchor="end">25</text><text x="80" y="215" text-anchor="end">50</text><text x="80" y="155" text-anchor="end">75</text><text x="80" y="95" text-anchor="end">100</text><text x="395" y="388" text-anchor="middle" font-size="15">Gradient Na+ tương đối (%)</text><text transform="translate(24 210) rotate(-90)" text-anchor="middle" font-size="15">Hấp thu glucose tương đối</text></g>
  <polyline points="170,282 290,236 410,190 530,139 650,102" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#14b8a6" stroke="#115e59" stroke-width="2"><circle cx="170" cy="282" r="8"/><circle cx="290" cy="236" r="8"/><circle cx="410" cy="190" r="8"/><circle cx="530" cy="139" r="8"/><circle cx="650" cy="102" r="8"/></g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#475569"><text x="170" y="352" text-anchor="middle">20</text><text x="290" y="352" text-anchor="middle">40</text><text x="410" y="352" text-anchor="middle">60</text><text x="530" y="352" text-anchor="middle">80</text><text x="650" y="352" text-anchor="middle">100</text></g>
</svg>
