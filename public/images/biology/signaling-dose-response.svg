<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Đồ thị liều ligand và mức đáp ứng của tế bào X, Y</title>
  <desc id="desc">Hai đường cong đều tiến đến đáp ứng tối đa gần 100 phần trăm. Đường X lệch trái và đạt 50 phần trăm đáp ứng ở nồng độ thấp hơn đường Y.</desc>
  <rect width="760" height="420" rx="24" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Liều ligand – mức đáp ứng</text>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="100" y1="320" x2="700" y2="320"/><line x1="100" y1="255" x2="700" y2="255"/>
    <line x1="100" y1="190" x2="700" y2="190"/><line x1="100" y1="125" x2="700" y2="125"/>
    <line x1="100" y1="60" x2="700" y2="60"/>
  </g>
  <line x1="100" y1="320" x2="708" y2="320" stroke="#334155" stroke-width="3"/>
  <line x1="100" y1="326" x2="100" y2="52" stroke="#334155" stroke-width="3"/>
  <g font-family="Arial, sans-serif" font-size="14" fill="#475569">
    <text x="84" y="325" text-anchor="end">0</text><text x="84" y="260" text-anchor="end">25</text>
    <text x="84" y="195" text-anchor="end">50</text><text x="84" y="130" text-anchor="end">75</text>
    <text x="84" y="65" text-anchor="end">100</text>
    <text x="100" y="345" text-anchor="middle">0</text><text x="220" y="345" text-anchor="middle">2</text>
    <text x="340" y="345" text-anchor="middle">4</text><text x="460" y="345" text-anchor="middle">6</text>
    <text x="580" y="345" text-anchor="middle">8</text><text x="700" y="345" text-anchor="middle">10</text>
  </g>
  <text x="400" y="389" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#334155">Nồng độ ligand (đơn vị tương đối)</text>
  <text x="26" y="190" text-anchor="middle" transform="rotate(-90 26 190)" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#334155">Đáp ứng tối đa (%)</text>
  <path d="M100 320 C145 315 168 270 205 205 C247 130 290 82 365 67 C455 49 585 60 700 60" fill="none" stroke="#2563eb" stroke-width="5"/>
  <path d="M100 320 C235 318 324 299 391 238 C450 184 490 109 555 78 C598 58 654 60 700 60" fill="none" stroke="#ea580c" stroke-width="5"/>
  <line x1="100" y1="190" x2="460" y2="190" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6"/>
  <circle cx="214" cy="190" r="7" fill="#2563eb"/><circle cx="447" cy="190" r="7" fill="#ea580c"/>
  <g font-family="Arial, sans-serif" font-size="16" font-weight="700">
    <rect x="555" y="104" width="132" height="62" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <line x1="570" y1="125" x2="600" y2="125" stroke="#2563eb" stroke-width="5"/><text x="610" y="131" fill="#1e40af">Tế bào X</text>
    <line x1="570" y1="148" x2="600" y2="148" stroke="#ea580c" stroke-width="5"/><text x="610" y="154" fill="#9a3412">Tế bào Y</text>
  </g>
</svg>
