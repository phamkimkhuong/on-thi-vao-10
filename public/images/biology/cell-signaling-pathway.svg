<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="title desc">
  <title id="title">Đường truyền tín hiệu R–A–B và đường vòng X</title>
  <desc id="desc">Ligand gắn thụ thể R trên màng tế bào. R hoạt hóa A, A hoạt hóa B và B tạo đáp ứng. Chất X đi thẳng đến B, bỏ qua R và A.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="760" height="400" rx="24" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Đường truyền tín hiệu trong tế bào</text>
  <line x1="45" y1="130" x2="715" y2="130" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>
  <text x="54" y="112" font-family="Arial, sans-serif" font-size="15" fill="#64748b">Ngoài tế bào</text>
  <text x="54" y="158" font-family="Arial, sans-serif" font-size="15" fill="#64748b">Trong tế bào</text>
  <ellipse cx="125" cy="75" rx="48" ry="26" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="125" y="81" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#92400e">Ligand</text>
  <line x1="125" y1="101" x2="125" y2="121" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="91" y="108" width="68" height="74" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="125" y="153" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1d4ed8">R</text>
  <text x="125" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#334155">Thụ thể</text>
  <line x1="160" y1="220" x2="267" y2="220" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <circle cx="305" cy="220" r="38" fill="#dcfce7" stroke="#16a34a" stroke-width="3" filter="url(#shadow)"/>
  <text x="305" y="229" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#166534">A</text>
  <line x1="343" y1="220" x2="440" y2="220" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <circle cx="478" cy="220" r="38" fill="#ede9fe" stroke="#7c3aed" stroke-width="3" filter="url(#shadow)"/>
  <text x="478" y="229" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#5b21b6">B</text>
  <line x1="516" y1="220" x2="603" y2="220" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="608" y="184" width="116" height="72" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3" filter="url(#shadow)"/>
  <text x="666" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#991b1b">Đáp ứng</text>
  <text x="666" y="236" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#991b1b">tế bào</text>
  <circle cx="305" cy="327" r="30" fill="#cffafe" stroke="#0891b2" stroke-width="3"/>
  <text x="305" y="334" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#155e75">X</text>
  <path d="M 335 319 C 390 307, 438 284, 467 257" fill="none" stroke="#0891b2" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <text x="410" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#155e75">Hoạt hóa trực tiếp B</text>
  <text x="380" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">X tạo đường vòng, bỏ qua mắt xích R và A</text>
</svg>
