<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Đường cong sinh trưởng của quần thể vi sinh vật</title>
  <desc id="desc">Đường cong gồm pha tiềm phát, pha lũy thừa, pha cân bằng và pha suy vong.</desc>
  <rect width="720" height="420" rx="28" fill="#f8fafc"/>
  <g stroke="#334155" stroke-width="3"><line x1="85" y1="340" x2="670" y2="340"/><line x1="85" y1="340" x2="85" y2="55"/></g>
  <g stroke="#cbd5e1" stroke-width="1"><line x1="85" y1="280" x2="670" y2="280"/><line x1="85" y1="220" x2="670" y2="220"/><line x1="85" y1="160" x2="670" y2="160"/><line x1="85" y1="100" x2="670" y2="100"/></g>
  <path d="M100 305 C145 300 175 295 205 280 C250 250 285 155 340 105 C390 75 455 78 515 85 C565 100 610 185 650 275" fill="none" stroke="#16a34a" stroke-width="7" stroke-linecap="round"/>
  <g stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"><line x1="205" y1="75" x2="205" y2="340"/><line x1="350" y1="75" x2="350" y2="340"/><line x1="520" y1="75" x2="520" y2="340"/></g>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#334155"><text x="145" y="375" font-size="17">Tiềm phát</text><text x="275" y="375" font-size="17">Lũy thừa</text><text x="435" y="375" font-size="17">Cân bằng</text><text x="590" y="375" font-size="17">Suy vong</text><text x="380" y="410" font-size="18">Thời gian</text><text transform="translate(25 220) rotate(-90)" font-size="18">Log số tế bào</text></g>
</svg>
